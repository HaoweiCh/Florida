# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

vars:
  GREETING: Hello, world!

tasks:
  default:
    desc: Print a greeting message
    cmds:
      - echo "{{.GREETING}}"
    silent: true

  fetch:
    cmds:
      - git clone --depth=1 -b 17.24.2 https://github.com/frida/frida.git src